[Main]
; 1 = ativa o mod
Enable=1
; Segurando A durante o agarrao (prompt de balancar o analogico), a cada N frames do jogo
; o contador do agarrao sobe como se voce tivesse mexido o analogico. Menor = mais rapido.
EveryNFrames=3
; quanto sobe a cada pulso (1 = igual a um movimento do analogico)
Amount=1
; opcional: codigo virtual-key de uma tecla do teclado que faca o mesmo (0 = so o A do controle).
; Exemplo: 69 = E, 70 = F 
ExtraKeyVK=69
; 1 = grava RE4_GrabMash.log na pasta do jogo
Log=0
